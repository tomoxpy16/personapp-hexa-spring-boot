#Logging config (en consola solo WARN para no ensuciar el menu; detalle en el archivo)
logging.level.root=WARN
logging.level.co.edu.javeriana=INFO
logging.threshold.console=WARN
logging.file.name=logs/persona-cli.log
spring.main.banner-mode=off
spring.main.web-application-type=none
#Bean reference Config (los mappers se referencian entre si)
spring.main.allow-circular-references=true
#MariaDB Config
spring.datasource.url=jdbc:mariadb://${MARIADB_HOST:localhost}:${MARIADB_PORT:3307}/persona_db
spring.datasource.username=${MARIADB_USER:persona_db}
spring.datasource.password=${MARIADB_PASSWORD:persona_db}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
#MongoDB Config (Spring Boot 4: prefijo spring.mongodb.*)
spring.mongodb.host=${MONGO_HOST:localhost}
spring.mongodb.port=${MONGO_PORT:27017}
spring.mongodb.database=persona_db
spring.mongodb.authentication-database=admin
spring.mongodb.username=${MONGO_USER:persona_db}
spring.mongodb.password=${MONGO_PASSWORD:persona_db}
